name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: 1
  AKAGI_MOCK_MODE: 0
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify release tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match package.json version '$expectedTag'."
          }
          Write-Host "Release version validated: $expectedTag"

  pre-release-test:
    needs: validate-version
    uses: ./.github/workflows/test.yml

  build:
    needs: [validate-version, pre-release-test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: akagi_backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Python virtual environment
        uses: actions/cache@v5
        id: venv-cache
        with:
          path: akagi_backend/.venv
          key: venv-build-${{ runner.os }}-py3.12-${{ hashFiles('akagi_backend/pyproject.toml') }}
          restore-keys: |
            venv-build-${{ runner.os }}-py3.12-

      - name: Install Python dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: akagi_backend
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate || source .venv/Scripts/activate
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install JS dependencies
        run: npm ci

      - name: Verify synchronized package versions
        run: npm exec -- tsx scripts/sync_version.ts --check

      - name: Build Electron App
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}
          path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.dmg
            dist/release/*.tar.gz
            dist/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload build artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failed-build-artifacts-${{ matrix.os }}
          path: |
            dist/
            electron/**/*.log
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create complete GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: docs/RELEASE_NOTES_v1.2.0.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
